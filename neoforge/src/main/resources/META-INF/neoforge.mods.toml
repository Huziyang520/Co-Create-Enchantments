license="${license}"

[[mods]]
modId="${mod_id}"
version="${version}"
displayName="${mod_name}"
authors="${mod_author}"
iconFile="icon.png"
displayURL="https://github.com/Huziyang520/Co-Create-Enchantments"
issueTrackerURL="https://github.com/Huziyang520/Co-Create-Enchantments/issues"
description='''${description}'''

[[mixins]]
config = "co_create_enchantments.mixins.json"

[[dependencies.${mod_id}]]
    modId="neoforge"
    type="required"
    versionRange="[${neoforge_version},)"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="merlinlib"
    type="required"
    versionRange="[${merlinlib_version},)"
    ordering="BEFORE"
    side="BOTH"
